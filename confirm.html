<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>班表確認</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 16px;
    color: #1f2937;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }

  h2 {
    margin: 0 0 12px;
    text-align: center;
  }

  h3 {
    margin: 0 0 12px;
    font-size: 16px;
    color: #374151;
  }

  /* ===== 查詢列 ===== */
  .search-row {
    display: flex;
    gap: 8px;
  }

  .search-row input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
  }

  .search-row button {
    padding: 12px 18px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
  }

  /* ===== 人員資訊 ===== */
  .info-grid {
    display: grid;
    grid-template-columns: 80px 1fr;
    row-gap: 8px;
    column-gap: 12px;
    font-size: 15px;
  }

  .info-label {
    color: #6b7280;
  }

  /* ===== 班表表格 ===== */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }

  thead {
    background: #f1f5f9;
  }

  th, td {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
  }

  th {
    font-weight: 600;
    color: #374151;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  /* ===== 簽核按鈕 ===== */
  .action-btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    background: #16a34a;
    color: white;
    font-weight: 700;
  }

  .hidden {
    display: none;
  }
  /* 登入區 */
.login-box{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:12px;
}

.login-box input{
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #d1d5db;
}

.login-box button{
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#2563eb;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.login-links{
  margin-top:10px;
  text-align:right;
  font-size:14px;
}

.login-links a{
  margin-left:10px;
  color:#2563eb;
  text-decoration:none;
}
  /* Modal */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

.modal-content{
background:#fff;
padding:24px;
border-radius:12px;
width:320px;
display:flex;
flex-direction:column;
gap:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.modal-content input{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.modal-content button{
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:600;
cursor:pointer;
}

.modal-close{
background:#6b7280;
}

.modal.hidden{
display:none;
}
</style>
</head>

<body>

<div class="container">

  <!-- 查詢 -->
  <div class="card">
    <h2>班表確認</h2>
    <!-- 登入區 -->


<div id="taskDisplay" style="text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px;">
  任務載入中...
</div>
    <div class="login-box">

  <input id="loginStaff" placeholder="員編 (大W+員編)">

  <input id="loginPassword" type="password" placeholder="密碼">

<button id="lookupBtn" onclick="login()">
登入查核班表
</button>

</div>

<div class="login-links">
  <a href="#" onclick="openRegister()">註冊</a>
  <a href="#" onclick="openReset()">忘記密碼</a>
</div>

  </div>

  <!-- 查詢結果 -->
  <div class="card hidden" id="resultCard">

    <!-- 人員資訊 -->
    <h3>簽核人資料</h3>
    <div class="info-grid">
      <div class="info-label">姓名</div>
      <div id="name"></div>
      <div class="info-label">員編</div>
      <div id="staff"></div>
    </div>

    <!-- 班表 -->
<h3 style="margin-top:16px;" id="scheduleTitle">
  班表內容
</h3>
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>班別</th>
          <th>備註</th>
        </tr>
      </thead>
      <tbody id="scheduleTable"></tbody>
    </table>

    <button class="action-btn" onclick="goSign()">
      確認並簽核
    </button>
  </div>

</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const taskId = urlParams.get('id');

let currentStaffId = "";
let isLogin = false;
let loginStaff = "";

window.onload = function() {
  const display = document.getElementById("taskDisplay");
  if (!taskId) {
    display.innerHTML = "<b style='color:red;'>錯誤：缺少任務 ID，請洽單位主管。</b>";
    document.getElementById("lookupBtn").disabled = true;
    return;
  }
  display.innerText = `任務編號：${taskId}`;

  const match = taskId.match(/task-(\d{6})/);
  if (match) {
    const ym = match[1];
    const year = ym.substring(0,4);
    const month = parseInt(ym.substring(4,6),10);
    const title = document.getElementById("scheduleTitle");
    if (title) title.innerText = `班表內容｜${year}年${month}月`;
  }
};

// 📍 1. 登入並直接取得資料
async function login() {
  const staff = document.getElementById("loginStaff").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if(!staff || !password){
    alert("請輸入員編與密碼");
    return;
  }

  const btn = document.getElementById("lookupBtn");
  btn.innerText = "驗證並載入中...";
  btn.disabled = true;

  try {
    const res = await fetch(
      "https://chihwei-n8n.zeabur.app/webhook/staff-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          staff_id: staff,
          password: password,
          task_id: taskId
        })
      }
    );

    const data = await res.json();

    if (data.login) {
      isLogin = true;
      loginStaff = staff;
      alert("登入成功");

      // 這裡不再呼叫 lookup()，直接把拿到的 data 丟給顯示函數
      displayData(data);

      document.getElementById("loginStaff").readOnly = true;
      document.getElementById("loginPassword").readOnly = true;
      btn.innerText = "查詢成功";
    } else {
      alert(data.message || "帳號或密碼錯誤");
      btn.innerText = "登入查核班表";
      btn.disabled = false;
    }
  } catch (e) {
    alert("系統連線失敗");
    btn.disabled = false;
    btn.innerText = "登入查核班表";
  }
}

// 📍 2. 專門負責把資料塞進 HTML 的函數
// 📍 2. 專門負責把資料塞進 HTML 的函數 (修正版)
function displayData(record) {
  currentStaffId = record.staff_id;
  document.getElementById("name").innerText = record.name || "未定義";
  document.getElementById("staff").innerText = record.staff_id;

  const tbody = document.getElementById("scheduleTable");
  const tableContainer = tbody.closest("table"); // 取得 table 標籤本身
  tbody.innerHTML = "";

  // 顯示簽核月份
  if (record.sign_month) {
    const ym = String(record.sign_month);
    let year = ym.substring(0, 4);
    let month = parseInt(ym.substring(5, 7) || ym.substring(4, 6), 10);
    document.getElementById("scheduleTitle").innerText = `班表內容｜${year}年${month}月`;
  }

  // --- 📍 核心修改：判斷是否為手動新增人員 ---
  if (record.source === "manual") {
    // 1. 隱藏表格
    tableContainer.style.display = "none";
    
    // 2. 在表格位置插入 PDF 查看區塊
    const pdfHTML = `
      <div id="pdfArea" style="margin: 20px 0; padding: 20px; background: #fffbeb; border: 1px solid #fef3c7; border-radius: 12px; text-align: center;">
        <div style="font-size: 32px; margin-bottom: 8px;">📋</div>
        <h4 style="color: #92400e; margin: 0 0 8px 0;">您為手動補登人員</h4>
        <p style="color: #b45309; font-size: 14px; margin-bottom: 16px;">
          系統無您的個人班表資料，請點擊下方按鈕核對「班表總表」無誤後，再行簽核。
        </p>
        <a href="${record.pdf_url}" target="_blank" 
           style="display: inline-block; background: #f59e0b; color: white; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
           👁 查看班表總表 PDF
        </a>
      </div>
    `;
    // 確保不會重複插入
    const existingPdf = document.getElementById("pdfArea");
    if (existingPdf) existingPdf.remove();
    tableContainer.insertAdjacentHTML('afterend', pdfHTML);

  } else {
    // 3. 正常人員：顯示表格並清空可能存在的 PDF 區塊
    tableContainer.style.display = "table";
    const existingPdf = document.getElementById("pdfArea");
    if (existingPdf) existingPdf.remove();

    // 處理班表排序與顯示
    if (Array.isArray(record.schedule_json) && record.schedule_json.length > 0) {
      record.schedule_json.sort((a, b) => Number(a.date) - Number(b.date));
      record.schedule_json.forEach(entry => {
        tbody.innerHTML += `
          <tr>
            <td>${entry.date}</td>
            <td>${entry.shift}</td>
            <td>${entry.note || "-"}</td>
          </tr>`;
      });
    } else {
      tbody.innerHTML = "<tr><td colspan='3'>尚無班表資料</td></tr>";
    }
  }

  // 顯示結果區塊
  document.getElementById("resultCard").classList.remove("hidden");
}


// 📍 3. 前往簽核頁面
function goSign() {
  if (!currentStaffId || !taskId) return alert("資料不完整");
  location.href = `sign.html?id=${taskId}&staffId=${encodeURIComponent(currentStaffId)}`;
}
  
/* Modal 控制 */

function openRegister(){
document.getElementById("registerModal").classList.remove("hidden");
}

function openReset(){
document.getElementById("resetModal").classList.remove("hidden");
}

function closeModal(){
document.getElementById("registerModal").classList.add("hidden");
document.getElementById("resetModal").classList.add("hidden");
}


/* 註冊 */

async function submitRegister() {
  // 1. 抓取畫面上所有輸入框的值 (包含新增的姓名)
  const name = document.getElementById("regName").value.trim();
  const staff = document.getElementById("regStaff").value.trim();
  const birthday = document.getElementById("regBirthday").value.trim();
  const unit = document.getElementById("regUnit").value.trim();
  const pass1 = document.getElementById("regPassword").value.trim();
  const pass2 = document.getElementById("regPassword2").value.trim();

  // 2. 檢查姓名跟員編有沒有填
  if (!name || !staff) {
    alert("姓名與員編為必填項目");
    return;
  }

  // 3. 檢查兩次密碼是否相同
  if (pass1 !== pass2) {
    alert("兩次密碼不一致");
    return;
  }

  try {
    // 4. 送出資料給 n8n
    const res = await fetch(
      "https://chihwei-n8n.zeabur.app/webhook/staff-register",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: name,         // <--- 這裡會把姓名傳給 n8n
          staff_id: staff,
          birthday: birthday,
          unit: unit,
          password: pass1
        })
      }
    );

    const data = await res.json();

    // 5. 如果註冊成功
    if (data.success) {
      alert("註冊成功！請輸入密碼進行登入。");

      // 自動幫同仁填好員編，但密碼空著讓他自己打
      document.getElementById("loginStaff").value = staff;
      document.getElementById("loginPassword").value = "";

      // 關閉註冊小視窗
      closeModal();

      // 💡 移除原本的 login(); 不再自動登入，避免出錯
      
    } else {
      alert(data.message || "註冊失敗");
    }
  } catch (e) {
    alert("註冊連線失敗，請檢查網路");
  }
}


/* 重設密碼 */

async function submitReset(){

const staff = document.getElementById("resetStaff").value.trim();
const birthday = document.getElementById("resetBirthday").value.trim();
const pass1 = document.getElementById("resetPassword").value.trim();
const pass2 = document.getElementById("resetPassword2").value.trim();

if(pass1 !== pass2){
alert("兩次密碼不一致");
return;
}

const res = await fetch(
"https://chihwei-n8n.zeabur.app/webhook/staff-reset-password",
{
method:"POST",
headers:{ "Content-Type":"application/json"},
body:JSON.stringify({
staff_id:staff,
birthday:birthday,
password:pass1
})
});

const data = await res.json();

if(data.success){

alert("密碼更新成功");

closeModal();

}else{

alert(data.message || "驗證失敗");

}

}
  
</script>

  <!-- 註冊 Modal -->
<div id="registerModal" class="modal hidden">
<div class="modal-content">

<h3>新帳號註冊</h3>
<input id="regName" placeholder="姓名 (例如：張小明)">
<input id="regStaff" placeholder="員編 (大W+員編)">
<input id="regBirthday" placeholder="生日 (民國七碼 0740121)">
<input id="regUnit" placeholder="服務單位">
<input id="regPassword" type="password" placeholder="密碼 (6碼以上英文+數字)">
<input id="regPassword2" type="password" placeholder="再次輸入密碼">

<button onclick="submitRegister()">建立帳號</button>

<button class="modal-close" onclick="closeModal()">取消</button>

</div>
</div>


<!-- 重設密碼 Modal -->
<div id="resetModal" class="modal hidden">
<div class="modal-content">

<h3>重設密碼</h3>

<input id="resetStaff" placeholder="員編 (大W+員編)">
<input id="resetBirthday" placeholder="生日 (民國七碼 0740121)">

<input id="resetPassword" type="password" placeholder="新密碼">
<input id="resetPassword2" type="password" placeholder="再次輸入密碼">

<button onclick="submitReset()">更新密碼</button>

<button class="modal-close" onclick="closeModal()">取消</button>

</div>
</div>
</body>
</html>
