<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>班表確認</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 16px;
    color: #1f2937;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }

  h2 {
    margin: 0 0 12px;
    text-align: center;
  }

  h3 {
    margin: 0 0 12px;
    font-size: 16px;
    color: #374151;
  }

  /* ===== 查詢列 ===== */
  .search-row {
    display: flex;
    gap: 8px;
  }

  .search-row input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
  }

  .search-row button {
    padding: 12px 18px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
  }

  /* ===== 人員資訊 ===== */
  .info-grid {
    display: grid;
    grid-template-columns: 80px 1fr;
    row-gap: 8px;
    column-gap: 12px;
    font-size: 15px;
  }

  .info-label {
    color: #6b7280;
  }

  /* ===== 班表表格 ===== */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }

  thead {
    background: #f1f5f9;
  }

  th, td {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
  }

  th {
    font-weight: 600;
    color: #374151;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  /* ===== 簽核按鈕 ===== */
  .action-btn {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    background: #16a34a;
    color: white;
    font-weight: 700;
  }

  .hidden {
    display: none;
  }
  /* 登入區 */
.login-box{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:12px;
}

.login-box input{
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #d1d5db;
}

.login-box button{
  padding:12px;
  font-size:16px;
  border-radius:10px;
  border:none;
  background:#2563eb;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.login-links{
  margin-top:10px;
  text-align:right;
  font-size:14px;
}

.login-links a{
  margin-left:10px;
  color:#2563eb;
  text-decoration:none;
}
  /* Modal */

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

.modal-content{
background:#fff;
padding:24px;
border-radius:12px;
width:320px;
display:flex;
flex-direction:column;
gap:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.modal-content input{
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

.modal-content button{
padding:10px;
border:none;
border-radius:8px;
background:#2563eb;
color:#fff;
font-weight:600;
cursor:pointer;
}

.modal-close{
background:#6b7280;
}

.modal.hidden{
display:none;
}
</style>
</head>

<body>

<div class="container">

  <!-- 查詢 -->
  <div class="card">
    <h2>班表確認</h2>
    <!-- 登入區 -->


<div id="taskDisplay" style="text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px;">
  任務載入中...
</div>
    <div class="login-box">

  <input id="loginStaff" placeholder="員編 (大W+員編)">

  <input id="loginPassword" type="password" placeholder="密碼">

<button id="lookupBtn" onclick="login()">
登入查核班表
</button>

</div>

<div class="login-links">
  <a href="#" onclick="openRegister()">註冊</a>
  <a href="#" onclick="openReset()">忘記密碼</a>
</div>

  </div>

  <!-- 查詢結果 -->
  <div class="card hidden" id="resultCard">

    <!-- 人員資訊 -->
    <h3>簽核人資料</h3>
    <div class="info-grid">
      <div class="info-label">姓名</div>
      <div id="name"></div>
      <div class="info-label">員編</div>
      <div id="staff"></div>
    </div>

    <!-- 班表 -->
<h3 style="margin-top:16px;" id="scheduleTitle">
  班表內容
</h3>
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>班別</th>
          <th>備註</th>
        </tr>
      </thead>
      <tbody id="scheduleTable"></tbody>
    </table>

    <button class="action-btn" onclick="goSign()">
      確認並簽核
    </button>
  </div>

</div>

<script>
// 📍 1. 抓取 URL 中的 task_id (例如：confirm.html?id=task-202603-XXX)
const urlParams = new URLSearchParams(window.location.search);
const taskId = urlParams.get('id');

let currentStaffId = "";
let isLogin = false;
let loginStaff = "";
// 📍 2. 頁面載入檢查
window.onload = function() {

  const display = document.getElementById("taskDisplay");

  if (!taskId) {
    display.innerHTML = "<b style='color:red;'>錯誤：缺少任務 ID，請洽單位主管。</b>";
document.getElementById("lookupBtn").disabled = true;    return;
  }

  display.innerText = `任務編號：${taskId}`;

  /* ===== 從 taskId 解析簽核月份 ===== */

  // task-202604-L9B
  const match = taskId.match(/task-(\d{6})/);

  if (match) {

    const ym = match[1];   // 202604

    const year = ym.substring(0,4);
    const month = parseInt(ym.substring(4,6),10);

    const title = document.getElementById("scheduleTitle");

    if (title) {
      title.innerText = `班表內容｜${year}年${month}月`;
    }

  }

};

  async function login() {

  const staff = document.getElementById("loginStaff").value.trim();
  const password = document.getElementById("loginPassword").value.trim();

  if(!staff || !password){
    alert("請輸入員編與密碼");
    return;
  }

  try{

    const res = await fetch(
      "https://chihwei-n8n.zeabur.app/webhook/staff-login",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json"},
        body:JSON.stringify({
          staff_id: staff,
          password: password,
          task_id: taskId
        })
      }
    );

    const data = await res.json();

    if(data.login){

      isLogin = true;
      loginStaff = staff;

alert("登入成功");
lookup();
      document.getElementById("loginStaff").readOnly = true;
      document.getElementById("loginPassword").readOnly = true;
      document.getElementById("lookupBtn").disabled = false;

    }else{

      alert("帳號或密碼錯誤");

    }

  }catch(e){

    alert("登入失敗");

  }

}
// 📍 3. 查詢班表函數
async function lookup() {
  if(!isLogin){
  alert("請先登入");
  return;
}
const staffIdInput =
document.getElementById("loginStaff").value.trim();

const password =
document.getElementById("loginPassword").value.trim();  if (staffIdInput !== document.getElementById("loginStaff").value.trim()) {
  alert("登入驗證失敗");
  return;
}
  if (!staffIdInput) return alert("請輸入員編");
const btn = document.getElementById("lookupBtn");
  btn.innerText = "查詢中...";
  btn.disabled = true;

  try {
const res = await fetch(
`https://chihwei-n8n.zeabur.app/webhook/Staff-check-roster`,
{
method:"POST",
headers:{ "Content-Type":"application/json"},
body:JSON.stringify({
taskId:taskId,
staffId:staffIdInput,
password:password
})
});
    if (!res.ok) throw new Error("查無此員編或任務已過期");

    const record = await res.json();
    currentStaffId = staffIdInput;

    document.getElementById("name").innerText = record.name || "未定義";
    document.getElementById("staff").innerText = record.staff_id || staffIdInput;

    const tbody = document.getElementById("scheduleTable");
    tbody.innerHTML = "";

// 顯示簽核月份
if (record.sign_month) {
  const ym = String(record.sign_month);

  let year, month;

  if (ym.includes("-")) {
    [year, month] = ym.split("-");
  } else {
    year = ym.substring(0,4);
    month = ym.substring(4,6);
  }

  month = parseInt(month,10);

  document.getElementById("scheduleTitle").innerText =
    `班表內容｜${year}年${month}月`;
}

// 日期排序（小到大）
if (Array.isArray(record.schedule_json) && record.schedule_json.length > 0) {

  record.schedule_json.sort((a, b) => {
    return Number(a.date) - Number(b.date);
  });

  record.schedule_json.forEach(entry => {
        tbody.innerHTML += `
          <tr>
            <td>${entry.date}</td>
            <td>${entry.shift}</td>
            <td>${entry.note || "-"}</td>
          </tr>`;
      });
  
    } else {
      tbody.innerHTML = "<tr><td colspan='3'>尚無班表資料</td></tr>";
    }

    document.getElementById("resultCard").classList.remove("hidden");
  } catch (err) {
    alert(err.message || "查詢失敗，請稍後再試");
    document.getElementById("resultCard").classList.add("hidden");
  } finally {
    btn.innerText = "查詢班表";
    btn.disabled = false;
  }
}

// 📍 4. 前往簽核頁面
function goSign() {
  if (!currentStaffId || !taskId) return alert("資料不完整");
  // 帶著 ID 前往簽名頁
  location.href = `sign.html?id=${taskId}&staffId=${encodeURIComponent(currentStaffId)}`;
}
/* Modal 控制 */

function openRegister(){
document.getElementById("registerModal").classList.remove("hidden");
}

function openReset(){
document.getElementById("resetModal").classList.remove("hidden");
}

function closeModal(){
document.getElementById("registerModal").classList.add("hidden");
document.getElementById("resetModal").classList.add("hidden");
}


/* 註冊 */

async function submitRegister(){

const staff = document.getElementById("regStaff").value.trim();
const birthday = document.getElementById("regBirthday").value.trim();
const unit = document.getElementById("regUnit").value.trim();
const pass1 = document.getElementById("regPassword").value.trim();
const pass2 = document.getElementById("regPassword2").value.trim();

if(pass1 !== pass2){
alert("兩次密碼不一致");
return;
}

const res = await fetch(
"https://chihwei-n8n.zeabur.app/webhook/staff-register",
{
method:"POST",
headers:{ "Content-Type":"application/json"},
body:JSON.stringify({
staff_id:staff,
birthday:birthday,
unit:unit,
password:pass1
})
});

const data = await res.json();

if(data.success){

alert("註冊成功");

document.getElementById("loginStaff").value = staff;
document.getElementById("loginPassword").value = pass1;

closeModal();

/* 自動登入 */
login();

}else{

alert(data.message || "註冊失敗");

}

}


/* 重設密碼 */

async function submitReset(){

const staff = document.getElementById("resetStaff").value.trim();
const birthday = document.getElementById("resetBirthday").value.trim();
const pass1 = document.getElementById("resetPassword").value.trim();
const pass2 = document.getElementById("resetPassword2").value.trim();

if(pass1 !== pass2){
alert("兩次密碼不一致");
return;
}

const res = await fetch(
"https://chihwei-n8n.zeabur.app/webhook/staff-reset-password",
{
method:"POST",
headers:{ "Content-Type":"application/json"},
body:JSON.stringify({
staff_id:staff,
birthday:birthday,
password:pass1
})
});

const data = await res.json();

if(data.success){

alert("密碼更新成功");

closeModal();

}else{

alert(data.message || "驗證失敗");

}

}
  
</script>

  <!-- 註冊 Modal -->
<div id="registerModal" class="modal hidden">
<div class="modal-content">

<h3>新帳號註冊</h3>

<input id="regStaff" placeholder="員編 (大W+員編)">
<input id="regBirthday" placeholder="生日 (民國七碼 0740121)">
<input id="regUnit" placeholder="服務單位">
<input id="regPassword" type="password" placeholder="密碼 (6碼以上英文+數字)">
<input id="regPassword2" type="password" placeholder="再次輸入密碼">

<button onclick="submitRegister()">建立帳號</button>

<button class="modal-close" onclick="closeModal()">取消</button>

</div>
</div>


<!-- 重設密碼 Modal -->
<div id="resetModal" class="modal hidden">
<div class="modal-content">

<h3>重設密碼</h3>

<input id="resetStaff" placeholder="員編 (大W+員編)">
<input id="resetBirthday" placeholder="生日 (民國七碼 0740121)">

<input id="resetPassword" type="password" placeholder="新密碼">
<input id="resetPassword2" type="password" placeholder="再次輸入密碼">

<button onclick="submitReset()">更新密碼</button>

<button class="modal-close" onclick="closeModal()">取消</button>

</div>
</div>
</body>
</html>
